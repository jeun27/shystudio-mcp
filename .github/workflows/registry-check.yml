# Registry version check (AEO B23): server.json must be valid and not lower than the official MCP registry's version;
# on the daily schedule it must equal it (a bump that was never published shows up here). Read-only, no secrets.
name: registry-check
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/registry-check.test.mjs
      - name: server.json vs the registry
        run: node scripts/registry-check.mjs ${{ github.event_name == 'schedule' && '--expect-match' || '' }}
